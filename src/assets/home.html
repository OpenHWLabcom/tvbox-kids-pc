<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<style>
* { margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden;
  font-family:"Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  background:-webkit-linear-gradient(top,#0a1e3f 0%,#12539b 40%,#3f8fd4 75%,#a7d3f0 100%); }

#desk { position:absolute; left:0; top:0; right:0; bottom:42px; }

a.ic { position:absolute; width:80px; height:88px; text-align:center; text-decoration:none;
  display:block; cursor:pointer; }
a.ic img { width:48px; height:48px; margin-top:4px; }
a.ic .lb { color:#fff; font-size:12px; padding:1px 2px; text-shadow:0 1px 3px rgba(0,0,0,.95); }
a.ic:active { opacity:.55; }

#bar { position:absolute; left:0; right:0; bottom:0; height:42px; overflow:hidden;
  background:-webkit-linear-gradient(top,#20406e,#12294a);
  border-top:1px solid rgba(150,190,240,.55); }
#start { position:absolute; left:0; top:0; width:64px; height:42px; text-align:center; cursor:pointer;
  background:-webkit-linear-gradient(top,#2e5e9e,#173a63); border-right:1px solid rgba(150,190,240,.35); }
#start:active { background:-webkit-linear-gradient(top,#4f86cf,#2a5c95); }
.flag { display:inline-block; margin-top:10px; }
.flag .p { display:inline-block; width:9px; height:9px; margin:1px; background:#fff; }
#pin { position:absolute; left:70px; top:0; height:42px; }
a.pi { display:inline-block; width:42px; height:42px; text-align:center; vertical-align:top; text-decoration:none; }
a.pi img { width:26px; height:26px; margin-top:8px; }
a.pi:active { background:rgba(255,255,255,.15); }
#tray { position:absolute; right:0; top:0; height:42px; width:230px; text-align:right; }
#clock { display:inline-block; color:#eaf3ff; font-size:14px; line-height:42px; margin-right:12px; }

#menu { position:absolute; left:0; bottom:42px; width:300px; display:none;
  background:rgba(12,26,48,.96); border:1px solid rgba(120,170,230,.5); border-bottom:none;
  border-top-left-radius:8px; border-top-right-radius:8px; }
#menu .head { color:#cfe3ff; font-size:15px; padding:10px 14px; border-bottom:1px solid rgba(120,170,230,.25); }
#menu a.mi { display:block; padding:9px 14px; color:#eaf3ff; font-size:16px; text-decoration:none; }
#menu a.mi img { width:26px; height:26px; vertical-align:middle; margin-right:10px; }
#menu a.mi:active { background:rgba(90,150,230,.45); }
#menu a.foot { display:block; padding:9px 14px; border-top:1px solid rgba(120,170,230,.25); color:#ffd9d9; font-size:16px; text-decoration:none; }
#menu a.foot img { width:24px; height:24px; vertical-align:middle; margin-right:10px; }
</style></head>
<body>
<div id="desk">
  <a class="ic" href="app:browser"  style="left:16px;top:14px"><img src="icons/browser.png"><div class="lb">浏览器</div></a>
  <a class="ic" href="app:game"     style="left:16px;top:104px"><img src="icons/game.png"><div class="lb">玩游戏</div></a>
  <a class="ic" href="app:video"    style="left:16px;top:194px"><img src="icons/tv.png"><div class="lb">看视频</div></a>
  <a class="ic" href="app:music"    style="left:16px;top:284px"><img src="icons/music.png"><div class="lb">听音乐</div></a>
  <a class="ic" href="app:files"    style="left:104px;top:14px"><img src="icons/files.png"><div class="lb">文件</div></a>
  <a class="ic" href="app:settings" style="left:104px;top:104px"><img src="icons/gear.png"><div class="lb">设置</div></a>
</div>

<div id="menu">
  <div class="head">OpenHW Lab · 少儿电脑</div>
  <a class="mi" href="app:browser"><img src="icons/browser.png">浏览器</a>
  <a class="mi" href="app:game"><img src="icons/game.png">玩游戏</a>
  <a class="mi" href="app:video"><img src="icons/tv.png">看视频</a>
  <a class="mi" href="app:music"><img src="icons/music.png">听音乐</a>
  <a class="mi" href="app:files"><img src="icons/files.png">文件</a>
  <a class="mi" href="app:settings"><img src="icons/gear.png">设置</a>
  <a class="foot" href="app:power"><img src="icons/power.png">关机</a>
</div>

<div id="bar">
  <div id="start" onclick="toggleMenu()"><span class="flag"><span class="p"></span><span class="p"></span><br><span class="p"></span><span class="p"></span></span></div>
  <div id="pin">
    <a class="pi" href="app:browser"><img src="icons/browser.png"></a>
    <a class="pi" href="app:files"><img src="icons/files.png"></a>
    <a class="pi" href="app:settings"><img src="icons/gear.png"></a>
  </div>
  <div id="tray"><span id="clock">--:--</span></div>
</div>

<script>
function toggleMenu(){ var m=document.getElementById('menu');
  m.style.display = (m.style.display==='block') ? 'none' : 'block'; }
function tick(){ var d=new Date(); var h=d.getHours(), mi=d.getMinutes();
  h=(h<10?'0':'')+h; mi=(mi<10?'0':'')+mi;
  document.getElementById('clock').innerHTML = h+':'+mi+'  '+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate(); }
tick(); setInterval(tick, 10000);
</script>
</body></html>
